[platformio]
; 默认构建环境（可通过 PlatformIO 工具栏切换）
default_envs =esp32-c6

; 跨环境共享的全局配置
[env]
framework = espidf
; 💡 强行在这里补全底层缺失的判定变量，这样三个环境都能一步到位修复
board_build.frameworks = espidf
monitor_speed = 115200
lib_ldf_mode = deep
build_flags =
    -D LOG_LOCAL_LEVEL=ESP_LOG_INFO

; --- ESP32 经典经典系列 ---
[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
board_upload.flash_size = 4MB

; --- ESP32-C3 系列（RISC-V 架构） ---
[env:esp32-c3]
platform = espressif32@6.7.0
board = esp32-c3-devkitm-1  ; 💡 修正：在 esp32 后面加上了连字符 "-"
board_build.flash_mode = dio

; --- ESP32-C6 系列（RISC-V 架构 / 支持 Wi-Fi 6 + Zigbee） ---
[env:esp32-c6]
platform = espressif32@6.7.0
board = esp32-c6-devkitc-1
board_build.flash_mode = dio
; 💡 核心修复：手动补上官方开发板定义里漏掉的框架声明，防止编译脚本崩溃
board_build.frameworks = espidf