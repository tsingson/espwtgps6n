[platformio]
; Default build environments (select via PlatformIO toolbar)
default_envs =  esp32-c6

; Global configurations shared across all environments
[env]
framework = espidf
monitor_speed = 115200

# Forces the library dependency finder to scan deep for header references
lib_ldf_mode = deep

# Compilation and optimization flags
build_flags =
    -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
# Custom project optimizations can go here

; --- ESP32 Classic Environment ---
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
# Standard esp32dev modules have 4MB flash. If yours is custom 2MB, keep this.
board_upload.flash_size = 4MB

; --- ESP32-C3 Environment (RISC-V architecture) ---
[env:esp32-c3]
platform = espressif32@6.9.0
board = esp32c3-devkitm-1
board_build.flash_mode = dio

; --- NEW: ESP32-C6 Environment (RISC-V Wi-Fi 6 / Zigbee architecture) ---
[env:esp32-c6]
# ESP32-C6 requires a newer platform matrix layer (v6.4.0+ minimum)
platform = espressif32@6.9.0
board = esp32-c6-devkitc-1
# Essential C6 settings to ensure bootloader handles flash correctly
board_build.flash_mode = dio
